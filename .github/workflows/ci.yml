# CI for PodPoll: test -> build the three images (push on non-PR events) -> smoke-test what was
# pushed -> ci-ok, the single check a ruleset requires.
# Works for trunk-based (main) and Gitflow (develop, release/**, hotfix/**) alike.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      # Upstream only: lets the reference-solution branches prove they work. Harmless in a fork.
      - "solution/**"
    tags:
      - "v*"

# Least privilege: the GITHUB_TOKEN gets NO permissions by default; each job asks for what it needs.
permissions: {}

# One run per branch/PR at a time. A new push to a PR cancels the outdated run; pushes to
# branches queue instead (never cancel a build that may be publishing images).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # No dependency cache: nothing here needs one, and a cache that a PR can write to and a
          # publishing build later reads is a cache-poisoning risk (zizmor: cache-poisoning).
          package-manager-cache: false
      - name: Run every test suite (API incl. Postgres, node-agent, scripts, frontend)
        run: scripts/test.sh
      - name: Keep the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: api/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build (${{ matrix.component }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR. On pull requests nothing is pushed.
    strategy:
      fail-fast: false
      matrix:
        component: [api, frontend, node-agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # APP_VERSION, GIT_SHA, GIT_REF, BUILD_ID, BUILD_URL, CI_SYSTEM, BUILD_TIME, SOURCE_URL, IMAGE_TAG
      - name: Compute build provenance
        run: scripts/version.sh | tee -a "$GITHUB_ENV"

      - name: Image name and tags
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
        run: |
          image="${REGISTRY}/${OWNER,,}/podpoll-${COMPONENT}"   # registry paths must be lowercase
          tags="${image}:${IMAGE_TAG}"                          # immutable: sha-<12 hex chars>
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags+=$'\n'"${image}:${GITHUB_REF_NAME}"            # plus vX.Y.Z on release tags
          fi
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          { echo "TAGS<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.TAGS }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
            GIT_REF=${{ env.GIT_REF }}
            BUILD_ID=${{ env.BUILD_ID }}
            BUILD_URL=${{ env.BUILD_URL }}
            CI_SYSTEM=${{ env.CI_SYSTEM }}
            BUILD_TIME=${{ env.BUILD_TIME }}
            SOURCE_URL=${{ env.SOURCE_URL }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo "### ${IMAGE##*/}"
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${APP_VERSION}\` |"
            echo "| tags | \`$(echo "$TAGS" | tr '\n' ' ')\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| pushed | ${PUSHED} |"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: smoke (pushed images)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the images we just pushed (they may still be private)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute build provenance
        run: scripts/version.sh >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start PodPoll from the pushed images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          export IMAGE_REGISTRY="${REGISTRY}/${OWNER,,}"
          docker compose -p podpoll-ci -f local/compose.yaml -f local/compose.registry.yaml \
            --env-file local/env/dev.env up -d --wait --wait-timeout 120
      - name: Smoke test (right commit on both tiers, store reachable, a vote counts)
        run: scripts/smoke-test.sh http://localhost:8081 --expect-sha "$GIT_SHA" --expect-env dev --timeout 60
      - name: Container logs
        if: failure()
        run: docker compose -p podpoll-ci -f local/compose.yaml logs --no-color --tail 100
