# Module 3 — Services
# A stable address for the API pods.
#   DNS name:   api   (inside the same namespace)   /   api.<namespace>.svc.cluster.local
#   Port:       5000
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    part-of: podpoll
spec:
  type: ClusterIP            # the default: reachable only from INSIDE the cluster
  selector:
    app: api                 # "send traffic to every READY pod with this label"
  ports:
    - port: 5000             # the port the Service listens on
      targetPort: 5000       # the port the container listens on
