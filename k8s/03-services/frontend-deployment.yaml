# Module 3 — Services
# The frontend tier: nginx serving the HTML page and proxying /api/* to the "api" Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    part-of: podpoll
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        part-of: podpoll
    spec:
      # This pod never calls the Kubernetes API, so it gets no token to leak (Module 8).
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: podpoll-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: UPSTREAM        # where nginx sends /api/ traffic:  <service-name>:<port>
              value: api:5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              memory: 64Mi
