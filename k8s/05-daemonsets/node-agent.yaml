# Module 5 — DaemonSets
# One node-agent pod on EVERY node. It reads facts about its node and reports them to the API.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  labels:
    app: node-agent
    part-of: podpoll
spec:
  # 👀 Look closely: there is NO `replicas:` field.
  #    The number of pods is decided by the number of nodes, not by you.
  selector:
    matchLabels:
      app: node-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1          # update one node's pod at a time
  template:
    metadata:
      labels:
        app: node-agent
        part-of: podpoll
    spec:
      # Control-plane nodes on kubeadm-style clusters are TAINTED so normal pods stay away.
      # Node agents (log shippers, monitoring, CNI...) usually want to run there too, so they tolerate it.
      # (minikube does not taint its control plane, so this is a no-op here — but it is what
      #  real clusters need. Try removing it on a playground cluster and see what happens.)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: podpoll-node-agent:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: API_URL
              value: http://api:5000          # a Service name, again
            - name: NODE_NAME                 # Downward API: which node am I on?
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:                       # a window into the NODE's filesystem
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-pod-logs
              mountPath: /host/var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
