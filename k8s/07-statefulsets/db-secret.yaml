# Module 7 — StatefulSets
# `stringData` means YOU write plain text, and Kubernetes base64-encodes it for storage --
# no more `echo -n 'foo' | base64` by hand. Read it back with `kubectl get secret podpoll-db
# -o jsonpath='{.data.DB_PASSWORD}' | base64 -d` and you'll see it was encoded either way.
#
# base64 is ENCODING, not ENCRYPTION. Anyone who can `kubectl get secret -o yaml` this can
# read it instantly. Real secrets management (sealed-secrets, External Secrets Operator,
# Vault, cloud-native secret stores) is a workshop of its own.
#
# DB_HOST isn't actually secret -- in a real app you'd put connection info like this in a
# ConfigMap and keep only DB_PASSWORD in a Secret. It's bundled together here on purpose:
# applying ONE object is what flips api-deployment.yaml from Redis mode to Postgres mode.
#
# Never commit real credentials like this to a real Git repo.
apiVersion: v1
kind: Secret
metadata:
  name: podpoll-db
  labels:
    part-of: podpoll
type: Opaque
stringData:
  DB_HOST: postgres-0.postgres
  DB_NAME: podpoll
  DB_USER: podpoll
  DB_PASSWORD: podpoll-workshop-pw
