# Module 7 — StatefulSets
# A headless Service gives each pod its OWN DNS name: postgres-0.postgres.<ns>.svc.cluster.local
# (not just one shared "postgres" name load-balanced across replicas, the way Module 3's
# ClusterIP Services work). DNS only returns a READY pod's address here -- that's why
# app.py's readiness probe matters just as much for a StatefulSet as it did for the api Deployment.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    part-of: podpoll
spec:
  clusterIP: None       # <-- this is what makes it "headless"
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
    part-of: podpoll
spec:
  serviceName: postgres   # MUST name the headless Service above -- this is what wires up the DNS
  replicas: 1
  podManagementPolicy: OrderedReady   # the default: postgres-1 waits for postgres-0 to be Ready
  # The defaults, spelled out here for teaching (kubectl explain if these look unfamiliar
  # on an older cluster). "Retain" means scaling down or deleting the StatefulSet leaves
  # every PersistentVolumeClaim right where it is -- Kubernetes never deletes your data
  # just because you asked for fewer replicas.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        part-of: podpoll
    spec:
      # Kubernetes normally injects POSTGRES_SERVICE_HOST / POSTGRES_SERVICE_PORT env vars
      # for every Service named "postgres" in this namespace -- pointless noise for a
      # database container that doesn't call any Kubernetes Service by that name. Off.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # This pod never calls the Kubernetes API, so it gets no token to leak (Module 8).
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          # NOTE: pinned to 17, not 18 -- Postgres 18's official image moved PGDATA to
          # /var/lib/postgresql/18/docker and moved the VOLUME declaration to
          # /var/lib/postgresql. Mounting a volume at .../data (like below) with image 18
          # SILENTLY does nothing: your data lands in an anonymous volume instead, and
          # every restart looks like a fresh database. 17 keeps the well-known layout.
          #
          # Kubernetes expands $(POD_NAME) here using this container's OWN env below --
          # so cluster_name becomes "postgres-0", "postgres-1", etc. That's how card 4 in
          # the UI can show you exactly which pod answered a query.
          args: ["-c", "cluster_name=$(POD_NAME)"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: podpoll-db
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: podpoll-db
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: podpoll-db
                  key: DB_NAME
            # A subdirectory, not the mount root: ext4/block-storage volumes (e.g. cloud
            # EBS volumes) often pre-create a "lost+found" directory at the mount root,
            # and initdb refuses to initialise into a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              # -h 127.0.0.1 forces TCP, not the Unix socket: during first-boot initdb, the
              # entrypoint briefly runs a TEMPORARY server that listens on the socket only,
              # to set up the database before the real server starts. Probing TCP means
              # "not ready until the REAL server is up," not "ready during setup."
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -p 5432 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # This is what makes a StatefulSet different from a Deployment with a shared PVC:
  # EACH pod gets its OWN claim, stamped from this template -- data-postgres-0,
  # data-postgres-1, ... -- instead of every replica fighting over one disk.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 512Mi
