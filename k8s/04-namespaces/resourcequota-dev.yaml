# Module 4 — Namespaces
# A budget for the dev namespace: at most 10 pods, no matter who asks.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pod-quota
  namespace: dev
spec:
  hard:
    pods: "10"
    # You can also cap CPU/memory, e.g.:
    #   requests.cpu: "1"
    #   requests.memory: 1Gi
    # ...but then EVERY pod in the namespace must declare requests (otherwise it is rejected),
    # which is what a LimitRange with defaults is for. Out of scope today.
