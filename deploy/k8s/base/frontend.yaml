# The frontend tier: unprivileged nginx on :8080, serving the UI and proxying /api/ to "api:5000".
# Service type ClusterIP: on EKS there is no load balancer by default (cost). Reach it with
#   kubectl -n <namespace> port-forward svc/frontend 8080:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: podpoll-frontend:unset-set-me-in-an-overlay
          ports:
            - containerPort: 8080
          env:
            - name: UPSTREAM                  # <service-name>:<port>; nginx resolves it ONCE at start
              value: api:5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          volumeMounts:
            - name: tmp                       # pid file and proxy buffers
              mountPath: /tmp
            - name: nginx-conf                # the template is rendered here at start
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
