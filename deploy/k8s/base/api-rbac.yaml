# The API's own identity, allowed to list pods in ITS namespace and nothing else (card 5).
# A Role/RoleBinding has no namespace here: the overlay's `namespace:` sets it on all three
# objects AND on the RoleBinding's ServiceAccount subject. Check it: kustomize build <overlay>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: podpoll-api
automountServiceAccountToken: false            # only pods that opt in get a token (the api does)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-reads-pods
subjects:
  - kind: ServiceAccount
    name: podpoll-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
