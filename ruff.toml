# Lint rules for all Python in the repo (`ruff check .`). Part of the app, not a pipeline:
# students wire ruff into pre-commit / CI in Phase 2, and a clean `main` must already pass.
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "RUF100"]
ignore = [
  "S310",   # urllib.urlopen with a URL from config is the whole point of the RBAC/ECS code
]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]   # asserts, fake test-only secrets, test subprocesses
