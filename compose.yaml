# PodPoll on plain Docker. One Compose *project* == one Kubernetes *namespace*:
#   docker compose -p podpoll-dev  --env-file env/dev.env  up -d --build
#   docker compose -p podpoll-prod --env-file env/prod.env up -d --build
# Each project gets its own network, so the bare name "api" resolves only inside that project.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # ephemeral, like k8s Module 2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  postgres:                       # only started when the "postgres" profile is active
    image: postgres:17-alpine     # pinned to 17: 18 moved PGDATA (see context doc)
    profiles: ["postgres"]
    command: ["postgres", "-c", "cluster_name=${PODPOLL_ENV:-default}-postgres"]
    environment:
      POSTGRES_USER: ${DB_USER:-podpoll}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-podpoll-dev-pw}
      POSTGRES_DB: ${DB_NAME:-podpoll}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
      args:
        APP_VERSION: ${API_VERSION:-1.0}
    image: podpoll-api:${API_VERSION:-1.0}
    environment:
      REDIS_HOST: redis
      POD_NAMESPACE: ${PODPOLL_ENV:-default}   # drives the coloured env badge in the UI
      NODE_NAME: ${NODE_NAME:-docker-host}
      DB_HOST: ${DB_HOST:-}                    # empty => Redis mode; "postgres" => Postgres mode
      DB_NAME: ${DB_NAME:-podpoll}
      DB_USER: ${DB_USER:-podpoll}
      DB_PASSWORD: ${DB_PASSWORD:-podpoll-dev-pw}
    depends_on:
      redis:
        condition: service_healthy
      postgres:                                # waited on only when the profile is active
        condition: service_healthy
        required: false
    healthcheck:                               # python:3.12-slim has no curl/wget
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/readyz', timeout=2)"]
      interval: 5s
      retries: 5
    deploy:
      replicas: ${API_REPLICAS:-2}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${FRONTEND_VERSION:-1.0}
    image: podpoll-frontend:${FRONTEND_VERSION:-1.0}
    environment:
      UPSTREAM: api:5000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started   # nginx resolves "api" once at startup; it must exist first
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  node-agent:
    build: ./node-agent
    image: podpoll-node-agent:1.0
    environment:
      API_URL: http://api:5000
      NODE_NAME: ${NODE_NAME:-docker-host}
      INTERVAL_SECONDS: "10"
    volumes:
      - /proc:/host/proc:ro          # /var/log/pods doesn't exist outside k8s -> pods_on_node = null
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
